[package]
name = "nhako-ffi"
description = "The Nhako Beam engine for the Android app (Kotlin, through UniFFI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "nhako_ffi"
# cdylib: libnhako_ffi.so for Android (and for the JVM tests on the build machine).
crate-type = ["cdylib", "lib"]

[[bin]]
# Generates the Kotlin bindings from the built library: see android/README.md.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
nhako-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time"] }
uniffi = { version = "0.32", features = ["cli"] }

[target.'cfg(target_os = "android")'.dependencies]
# Engine logs go to logcat (`adb logcat -s nhako`).
tracing-android = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
