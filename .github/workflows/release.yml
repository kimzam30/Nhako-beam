# Publishes a release when you push a version tag (docs/releasing.md):
#
#   node scripts/bump-version.mjs 0.2.0   then merge that to main
#   git tag -a v0.2.0 -m "Nhako Beam 0.2.0" origin/main && git push origin v0.2.0
#
# It checks the tag, runs every check and build in build.yml, then makes a *draft* release with the
# .deb, .exe, the .apk files and SHA256SUMS.txt. Nothing is public until you press Publish on GitHub.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The tag matches the version in every file
        run: node scripts/bump-version.mjs --check "${GITHUB_REF_NAME#v}"
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main. Merge to main first, then tag origin/main."
            exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      release: true
    secrets: inherit

  publish:
    name: Draft the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: nhako-beam-*
          path: built
          merge-multiple: true

      # Plain names without spaces, each with the version and what it's for.
      - name: Name the files
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          debs=(built/*.deb); exes=(built/*.exe); apks=(built/app-*-release.apk)
          if [ ${#debs[@]} -ne 1 ] || [ ${#exes[@]} -ne 1 ] || [ ${#apks[@]} -ne 3 ]; then
            echo "::error::Expected 1 .deb, 1 .exe and 3 .apk files, got ${#debs[@]}, ${#exes[@]} and ${#apks[@]}."
            ls -l built
            exit 1
          fi
          cp "${debs[0]}" "release/nhako-beam-$version-linux-amd64.deb"
          cp "${exes[0]}" "release/nhako-beam-$version-windows-x64-setup.exe"
          for apk in "${apks[@]}"; do
            abi=$(basename "$apk" | sed -e 's/^app-//' -e 's/-release\.apk$//')
            cp "$apk" "release/nhako-beam-$version-android-$abi.apk"
          done
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          ls -l release

      # The certificate every Android build is signed with, so people can check an .apk is yours.
      - name: Read the Android signing certificate
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --print-certs release/*-android-arm64-v8a.apk | tee certs.txt
          sha=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          if [ -z "$sha" ]; then echo "::error::Couldn't read the signing certificate."; exit 1; fi
          echo "APK_CERT_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Draft the release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{APK_CERT_SHA256}}/$APK_CERT_SHA256/g" \
            .github/release-notes.md > notes.md
          # Before 1.0, every release is a pre-release.
          pre=(); [[ "$version" == 0.* ]] && pre=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A second run for the same tag: replace the files, keep the notes you may have edited.
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag "${pre[@]}" \
              --title "Nhako Beam $version" --notes-file notes.md --generate-notes
          fi
          echo "Draft ready: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
