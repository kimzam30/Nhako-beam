# Checks, tests and installers for Windows, Linux and Android.
# Start it by hand: GitHub > Actions > "Build" > Run workflow. Free on public repositories.
# When it finishes, the .exe, .deb and .apk are under "Artifacts" on the run's page (kept 14 days).
# The Release workflow (release.yml) runs this too, with release: true (docs/releasing.md).
name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Sign the .apk with the release key, and fail without it.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller debug info keeps the test builds within the runners' disk space.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Push wake-up (wake/README.md): set the repository variable NHAKO_WAKE_URL to your wake service.
  # Empty means the apps are built without it.
  NHAKO_WAKE_URL: ${{ vars.NHAKO_WAKE_URL }}

jobs:
  linux:
    name: Linux (checks, tests, .deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: GTK and WebKit libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the UI's packages
        working-directory: desktop
        run: npm ci
      # The Tauri crate embeds desktop/dist, so the UI is built before any cargo step.
      - name: Build the UI
        working-directory: desktop
        run: npm run build

      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (engine, command line, desktop app)
        run: cargo test --workspace

      - name: UI type check
        working-directory: desktop
        run: npm run check
      - name: UI unit tests
        working-directory: desktop
        run: npm test
      - name: UI flows (Playwright, browser prototype)
        working-directory: desktop
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Build the .deb
        working-directory: desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: nhako-beam-linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-results
          path: desktop/test-results/
          retention-days: 7

  windows:
    name: Windows (checks, tests, .exe)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install the UI's packages
        working-directory: desktop
        run: npm ci
      - name: Build the UI
        working-directory: desktop
        run: npm run build

      - name: Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (engine, command line, desktop app)
        run: cargo test --workspace

      - name: Build the installer (.exe)
        working-directory: desktop
        run: npx tauri build

      # Signing with SignPath (free for open source, docs/releasing.md "Signing the Windows
      # installer"). Skipped until you set the repository variable SIGNPATH_ORGANIZATION_ID and the
      # secret SIGNPATH_API_TOKEN; until then SmartScreen says "Windows protected your PC" on
      # install (More info > Run anyway).
      - name: Hand the installer to SignPath
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: nhako-beam
          signing-policy-slug: ${{ inputs.release && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/release/bundle/signed
      - name: Use the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: cp -f target/release/bundle/signed/*.exe target/release/bundle/nsis/

      - uses: actions/upload-artifact@v4
        with:
          name: nhako-beam-windows-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android (tests, .apk)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 29.0.14206865
      # Your Firebase project's google-services.json, as the repository secret GOOGLE_SERVICES_JSON.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # The release key (docs/releasing.md). Without it, the .apk is signed with the runner's own
      # throwaway debug key: fine for trying a build, but it can't update an installed app.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      NHAKO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      NHAKO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Firebase config for push wake-up
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Release signing key
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = "true" ]; then
              echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. A release must be signed with the release key (docs/releasing.md)."
              exit 1
            fi
            echo "No release key: the .apk is signed with a throwaway debug key."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "NHAKO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner comes with the Android SDK; add the NDK and platform this app builds with.
      - name: Android NDK and platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: gradle/actions/setup-gradle@v4

      # Screens rendered on the JVM (Robolectric), the shared strings, and the real engine.
      - name: Unit and screenshot tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
      # F-Droid builds with -Pnhako.fdroid: no Firebase, no update check. Built here first (arm64
      # only) to prove it still builds and has no Firebase code in it; the files are replaced below.
      - name: The F-Droid build has no Firebase
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease -Pnhako.fdroid -Pnhako.abis=arm64-v8a
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if unzip -p "$apk" 'classes*.dex' | grep -aq 'Lcom/google/firebase/'; then
            echo "::error::The F-Droid build contains Firebase code."
            exit 1
          fi
          rm -rf app/build/outputs/apk/release
      - name: Build an .apk for each of arm64, arm32 and x86_64 phones
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      # An app bundle for Google Play, for when there's a Play account (docs/releasing.md). Kept as
      # a run artifact only: it's not something people install by hand.
      - name: Build the app bundle (.aab)
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-app-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: nhako-beam-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android/app/build/screenshots/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-results
          path: android/app/build/reports/tests/
          retention-days: 7
