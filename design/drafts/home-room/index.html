<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lofi Room Draft</title>
<style>
  :root { --panel: #14172af2; --ink: #f2f4f7; --mute: #aeb5c6; --accent: #1a6fe0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #05070f; color: var(--ink); font: 15px/1.4 Inter, 'Segoe UI', Roboto, system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible { outline: 2px solid #4da0ff; outline-offset: 2px; }
  ::selection { background: #1a6fe0; color: #fff; }

  #app { position: absolute; inset: 0; overflow: hidden; }
  body.phone { display: grid; place-items: center; background: #05070f; }
  body.phone #app { position: relative; inset: auto; width: min(390px, 100vw); height: min(844px, calc(100vh - 76px)); border-radius: 30px; box-shadow: 0 0 0 7px #1c2030, 0 24px 60px #000; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #060a1e; }
  .ink polygon, .ink rect, .ink path, .ink circle, .ink ellipse { stroke: #12141f; stroke-width: 1.3; stroke-linejoin: round; }

  .chrome { position: absolute; left: 0; right: 0; top: 0; padding: 18px 24px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; pointer-events: none; }
  .icons button { pointer-events: auto; }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .pill { min-width: 0; flex: 0 1 auto; text-shadow: 0 1px 3px #000c; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 21px; line-height: 27px; font-weight: 650; letter-spacing: -0.015em; white-space: nowrap; }
  .status i { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #4cc487; }
  .busy .status i { background: #4da0ff; animation: beat 1.1s ease-in-out infinite; }
  .status span { overflow: hidden; text-overflow: ellipsis; }
  .status em { flex: none; font-style: normal; color: #9acbff; font-variant-numeric: tabular-nums; }
  .self { font-size: 14px; color: #c9d0de; padding-left: 18px; }
  .icons { display: flex; gap: 6px; flex: none; }
  .icons button { width: 42px; height: 42px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; box-shadow: 0 6px 18px #0006; transition: transform .2s; }
  .icons button:hover { transform: scale(1.08); }
  /* The panel: buttons as sketched, on the room with no panel behind them. It follows the finger. */
  #tray { position: absolute; left: 50%; bottom: 0; width: min(520px, 100%); margin-left: calc(min(520px, 100%) / -2); padding: 0 16px calc(16px + env(safe-area-inset-bottom)); touch-action: none; will-change: transform; user-select: none; -webkit-user-select: none; z-index: 2; }
  #grab { display: block; width: 100%; height: 34px; cursor: grab; touch-action: none; }
  #grab:active { cursor: grabbing; }
  #grab span { display: block; width: 44px; height: 5px; margin: auto; border-radius: 3px; background: #ffffffa6; box-shadow: 0 1px 4px #000a; transition: width .25s, background-color .25s; }
  #grab:hover span { width: 56px; background: #fff; }
  #btns { display: grid; gap: 10px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .rv { display: flex; flex: 1 1 0; min-width: 0; will-change: transform, opacity; }
  .rv.circle { flex: none; }
  .btn { width: 100%; height: 56px; border-radius: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; background: #1a1e33f7; color: #f2f4f7; font-weight: 600; font-size: 15px; box-shadow: 0 8px 22px #0009, inset 0 0 0 1px #ffffff1c; transition: transform .32s cubic-bezier(.2,1.4,.4,1), background-color .15s; white-space: nowrap; }
  .btn:active { transform: scale(.94); transition: transform .08s ease-out, background-color .08s; background: #2a304c; }
  .btn.main { background: var(--accent); color: #fff; font-size: 16px; }
  .btn.main:active { background: #1559b8; }
  .btn.round { width: 48px; height: 48px; border-radius: 50%; padding: 0; }
  .btn svg { flex: none; }
  .send-card { width: 100%; margin-bottom: 4px; padding: 11px 15px; border-radius: 16px; background: #14172af7; box-shadow: 0 10px 26px #0008; display: none; }
  .busy .send-card { display: block; animation: rise-in .4s cubic-bezier(.2,1.2,.3,1); }
  .send-card small { color: var(--mute); display: block; font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .track { height: 6px; margin-top: 8px; border-radius: 3px; background: #ffffff26; overflow: hidden; }
  .track u { display: block; height: 100%; background: #4da0ff; border-radius: 3px; }
  @media (min-width: 1160px) { body:not(.phone) .send-card { position: absolute; left: calc(100% + 8px); top: -46px; width: 300px; margin: 0; } }
  .floordev { opacity: 0; pointer-events: none; }
  #scrim { position: absolute; inset: 0; background: #03050c; opacity: 0; pointer-events: none; z-index: 3; }
  #devs { position: absolute; left: 50%; bottom: 0; width: min(520px, 100%); margin-left: calc(min(520px, 100%) / -2); max-height: 82%; display: flex; flex-direction: column; background: #14172a; border-radius: 26px 26px 0 0; box-shadow: 0 -14px 44px #000a; z-index: 4; will-change: transform; }
  #devs[hidden] { display: none; }
  #devs-head { padding: 9px 20px 12px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  #devs-head .bar { display: block; width: 40px; height: 5px; margin: 0 auto 12px; border-radius: 3px; background: #ffffff55; }
  #devs-head h2 { font-size: 21px; letter-spacing: -0.015em; }
  #devs-head p { font-size: 13px; color: var(--mute); margin-top: 3px; }
  #devs-list { overflow-y: auto; padding: 0 10px 18px; overscroll-behavior: contain; }
  .drow { display: flex; align-items: center; gap: 2px; border-radius: 16px; }
  .drow > button:first-child { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; text-align: left; transition: transform .32s cubic-bezier(.2,1.4,.4,1), background-color .15s; }
  .drow > button:first-child:hover { background: #ffffff0d; }
  .drow > button:first-child:active { transform: scale(.97); background: #ffffff14; transition: transform .08s; }
  .drow > button:first-child:disabled { opacity: .55; cursor: default; transform: none; }
  .dico { flex: none; width: 42px; height: 42px; border-radius: 12px; background: #262b3f; display: grid; place-items: center; color: #cdd5e8; }
  .dtxt { min-width: 0; } .dtxt b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .dtxt small { display: block; font-size: 12.5px; color: var(--mute); }
  .tick { flex: none; width: 48px; height: 48px; display: grid; place-items: center; }
  .tick span { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; box-shadow: inset 0 0 0 2px #5b6585; color: transparent; transition: background-color .15s, box-shadow .15s, transform .36s cubic-bezier(.2,1.7,.4,1); }
  .tick[aria-checked="true"] span { background: var(--accent); box-shadow: none; color: #fff; transform: scale(1.04); }
  .tick:active span { transform: scale(.86); transition: transform .08s; }
  .tick.full span { opacity: .4; }
  .nudge { animation: nudge .34s cubic-bezier(.3,.7,.4,1); }
  @keyframes nudge { 25% { transform: translateX(-5px); } 60% { transform: translateX(4px); } }
  body.phone .status { font-size: 19px; line-height: 25px; }
  body.phone .chrome { padding: 14px 14px 0; }
  body.phone .icons { gap: 4px; } body.phone .icons button { width: 40px; height: 40px; }
  /* Phone, buttons swiped away: every device that isn't in the room, as round buttons like the folder one. */
  #stack { position: relative; }
  #bubbles { position: absolute; left: -16px; right: -16px; top: 0; display: flex; gap: 8px; padding: 0 16px 6px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding: 16px; scrollbar-width: none; touch-action: pan-x; overscroll-behavior-x: contain; }
  #bubbles::-webkit-scrollbar { display: none; }
  #bubbles:empty { display: none; }
  .bub { flex: none; width: 70px; display: grid; justify-items: center; gap: 5px; scroll-snap-align: start; will-change: transform, opacity; color: #f2f4f7; }
  .bub i { width: 48px; height: 48px; border-radius: 50%; background: #1a1e33f7; display: grid; place-items: center; box-shadow: 0 8px 22px #0009, inset 0 0 0 1px #ffffff1c; transition: transform .32s cubic-bezier(.2,1.4,.4,1), background-color .15s, box-shadow .2s; position: relative; }
  .bub:active i { transform: scale(.9); transition: transform .08s ease-out; background: #2a304c; }
  .bub small { max-width: 70px; font-size: 11.5px; font-weight: 600; line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000; }
  .bub:disabled { color: #9aa2b5; cursor: default; }
  .bub:disabled i::after { content: ''; position: absolute; right: 2px; bottom: 2px; width: 10px; height: 10px; border-radius: 50%; background: #818a9e; box-shadow: 0 0 0 2px #1a1e33; }
  .bub.go i { background: var(--accent); box-shadow: 0 0 0 3px #7db8ff, 0 8px 22px #0009; }

  /* Settings: picks who is in the room. */
  .sheet { position: absolute; top: 72px; right: 24px; width: 340px; padding: 16px; border-radius: 18px; background: #14172a; box-shadow: 0 18px 44px #000b; display: none; animation: rise-in .28s cubic-bezier(.2,.9,.3,1.1); }
  .sheet.open { display: block; }
  body.phone .sheet { left: 12px; right: 12px; width: auto; top: 66px; }
  .sheet h2 { font-size: 13px; color: var(--mute); font-weight: 600; margin-bottom: 8px; }
  .sheet b { display: block; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 12px; background: #262b3f; position: relative; }
  .seg i { position: absolute; left: 3px; top: 3px; bottom: 3px; width: calc((100% - 6px) / 2); border-radius: 9px; background: #3c4564; transition: transform .28s cubic-bezier(.2,.9,.3,1.15); }
  .seg button { position: relative; height: 38px; font-weight: 600; color: var(--mute); transition: color .2s; }
  .seg button.on { color: #fff; }
  .sheet p { font-size: 13px; color: var(--mute); margin-top: 9px; min-height: 2.8em; }

  .dock { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; padding: 6px; border-radius: 24px; background: #000000e6; box-shadow: 0 12px 34px #000b; max-width: calc(100vw - 16px); z-index: 5; }
  .dock button { height: 36px; padding: 0 12px; border-radius: 18px; font-weight: 600; font-size: 13px; white-space: nowrap; color: #d9dde8; }
  .dock button:hover { background: #262a31; }
  .dock button.on { background: #1a6fe0; color: #fff; }
  .dock hr { width: 1px; height: 20px; border: 0; background: #ffffff2e; margin: 0 3px; }
  body.phone #app { margin-top: 58px; }
  @media (max-width: 620px) { .dock { flex-wrap: wrap; justify-content: center; border-radius: 16px; } .dock hr { display: none; } }

  .tag text { font: 600 15px Inter, 'Segoe UI', Roboto, system-ui, sans-serif; }
  .dev { cursor: pointer; }
  .lift { transition: transform .32s cubic-bezier(.2,.9,.3,1.3); }
  .dev:hover .lift { transform: translateY(-7px); }
  .head, .breath { transition: transform .75s cubic-bezier(.3,.9,.3,1.1), opacity .3s; }
  .head { transform-box: fill-box; transform-origin: 80% 90%; }
  .breath { transform-box: fill-box; transform-origin: 50% 100%; }
  #stage.asleep .breath { animation: breathe 4.2s ease-in-out infinite; }
  #stage.awake .head { transform: translateY(-24px) rotate(-3deg); }
  #stage.awake .breath { transform: translateY(-10px); }
  #stage.awake .zs { opacity: 0; }
  .zs { transition: opacity .3s; }
  .zs text { font: 700 19px Inter, system-ui, sans-serif; fill: #dbe7ff; }

  @keyframes beat { 40% { transform: scale(1.3); } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(12px); } }
  @keyframes breathe { 50% { transform: scale(1.012, 1.03); } }
  @keyframes flow { to { stroke-dashoffset: -36; } }
  @keyframes pulse { 50% { opacity: .5; } }
  @keyframes tw { 50% { opacity: .2; } }
  @keyframes rainw { from { transform: translate(0, -16px); opacity: 0; } 30% { opacity: .75; } to { transform: translate(-7px, 28px); opacity: 0; } }
  @keyframes tail { 50% { transform: rotate(12deg); } }
  @keyframes dust { 0% { transform: translate(0, 0); opacity: 0; } 25% { opacity: .9; } 75% { opacity: .7; } 100% { transform: translate(var(--x, 16px), var(--y, -70px)); opacity: 0; } }
  @keyframes steam { 0% { transform: translateY(0) scaleX(1); opacity: 0; } 30% { opacity: .55; } 100% { transform: translateY(-34px) scaleX(1.5); opacity: 0; } }
  @keyframes z { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(22px, -42px) scale(1.15); opacity: 0; } }
  @keyframes shine { 50% { transform: scale(1.05); } }
  @keyframes flick { 0%, 100% { opacity: 1; } 92% { opacity: 1; } 95% { opacity: .78; } }
  .pulse { animation: pulse var(--d, 3s) ease-in-out infinite; }
  .tw { animation: tw var(--d, 3s) ease-in-out infinite; }
  .rainw { animation: rainw var(--d, 1s) linear infinite; }
  .tail { animation: tail var(--d, 4s) ease-in-out infinite; transform-box: fill-box; transform-origin: 0 100%; }
  .dust { animation: dust var(--d, 8s) ease-in-out infinite; }
  .steam { animation: steam var(--d, 3s) ease-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .z { animation: z var(--d, 4s) ease-out infinite; transform-box: fill-box; transform-origin: 0 100%; }
  .thread { stroke-dasharray: 3 15; animation: flow .7s linear infinite; }
  .boltg.go { animation: shine 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 30% 100%; }
  .flick { animation: flick 7s linear infinite; }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } .dust { opacity: .6; } }
</style>
</head>

<script>
// An original lofi night room in one-point perspective, inked and cel shaded. Everything is drawn
// once in daylight colours; hard-edged SVG colour filters turn it into night and lamp light.
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const lt = (c, t) => mix(c, '#ffffff', t), dk = (c, t) => mix(c, '#000000', t);
const rng = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const VP = [800, 420], F = 900, NS = 'style="stroke:none"', pick = (r, a) => a[Math.floor(r() * a.length)];
const n1 = (v) => (+v).toFixed(1);
const Pg = (a, c, ex = '') => `<polygon points="${a.map((p) => `${n1(p[0])},${n1(p[1])}`).join(' ')}" fill="${c}" ${ex}/>`;
const R = (x, y, w, h, c, ex = '') => `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" fill="${c}" ${ex}/>`;
const C = (x, y, r, c, ex = '') => `<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(r)}" fill="${c}" ${ex}/>`;
const E = (x, y, a, b, c, ex = '') => `<ellipse cx="${n1(x)}" cy="${n1(y)}" rx="${n1(a)}" ry="${n1(b)}" fill="${c}" ${ex}/>`;
const Pa = (d, c, ex = '') => `<path d="${d}" fill="${c}" ${ex}/>`;
const St = (d, c, w = 1.4, ex = '') => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
const Ln = (x1, y1, x2, y2, c, w = 1, ex = '') => `<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="${c}" stroke-width="${w}" ${ex}/>`;
const anim = (c, d, delay = 0) => `class="${c}" style="--d:${d}s;animation-delay:${delay}s"`;
const ext = (p, t) => [VP[0] + (p[0] - VP[0]) * t, VP[1] + (p[1] - VP[1]) * t];
/** A box from its front face on screen, going `d` deeper; shows the sides the camera can see. */
const bx = (x, y, w, h, z, d, c, o = {}) => {
  const K = (F + z) / (F + z + d), b = (px, py) => ext([px, py], K), top = o.top ?? lt(c, 0.16), side = o.side ?? dk(c, 0.22), under = o.under ?? dk(c, 0.42); let s = '';
  if (x > VP[0]) s += Pg([[x, y], b(x, y), b(x, y + h), [x, y + h]], side);
  if (x + w < VP[0]) s += Pg([[x + w, y], b(x + w, y), b(x + w, y + h), [x + w, y + h]], side);
  if (y > VP[1]) s += Pg([[x, y], [x + w, y], b(x + w, y), b(x, y)], top);
  if (y + h < VP[1]) s += Pg([[x, y + h], [x + w, y + h], b(x + w, y + h), b(x, y + h)], under);
  return s + R(x, y, w, h, c);
};
const BOOK = ['#c9413d', '#3d73b5', '#e0ad43', '#3e9169', '#7f58b3', '#e5e0d3', '#37465f', '#d9774a', '#8f9bb0', '#2d7f86', '#b9486f'];
/** A row of upright books, each with its own bands and title marks, some leaning, some with gaps. */
function books(x0, x1, base, hMax, seed, gap = 0.1) {
  const r = rng(seed); let s = '', x = x0;
  while (x < x1 - 8) {
    if (r() < gap) { x += 7 + r() * 16; continue; }

function shRun(t) { let dt = Math.min(0.05, (t - SH.last) / 1000); SH.last = t; while (dt > 0) { const q = Math.min(dt, 1 / 240); SH.v += (-K * (SH.y - SH.goal) - B * SH.v) * q; SH.y += SH.v * q; dt -= q; } if (Math.abs(SH.y - SH.goal) < 0.3 && Math.abs(SH.v) < 4) { SH.y = SH.goal; SH.v = 0; SH.on = false; shDraw(); if (SH.goal === SH.H) { devs.hidden = true; $('more').focus(); } return; } shDraw(); SH.raf = requestAnimationFrame(shRun); }
function shGo(to, v = 0) { SH.goal = to; SH.v = v; if (reduced.matches) { SH.y = to; SH.v = 0; shDraw(); if (to === SH.H) devs.hidden = true; return; } if (!SH.on) { SH.on = true; SH.last = performance.now(); SH.raf = requestAnimationFrame(shRun); } }
function openDevices() { renderList(); devs.hidden = false; SH.H = devs.offsetHeight + 20; if (!SH.on) { SH.y = SH.H; shDraw(); } shGo(0); }
const closeDevices = () => shGo(SH.H);
$('more').onclick = openDevices;
scrim.onclick = closeDevices;
function startSend(name) { sendTo = name; sending = true; pct = 12; paint(); draw(); }
function renderBubbles() {
  const left = bubBox.scrollLeft;
  bubBox.innerHTML = bubbleList.map((d) => `<button class="bub ${sending && sendTo === d.name ? 'go' : ''}" data-bub="${d.name}" aria-label="Send to ${d.name}${d.on ? '' : ', offline'}" ${d.on ? '' : 'disabled'}><i><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="${ICON[d.kind]}"/></svg></i><small>${d.name}</small></button>`).join('');
  bubBox.scrollLeft = left;
  measure();
}
let bubDragged = false;
bubBox.addEventListener('click', (e) => { const g = e.target.closest('[data-bub]'); if (bubDragged) { bubDragged = false; return; } if (g && !g.disabled) startSend(g.dataset.bub); });
bubBox.addEventListener('wheel', (e) => { bubBox.scrollLeft += e.deltaY + e.deltaX; e.preventDefault(); }, { passive: false });
$('devs-list').addEventListener('click', (e) => {
  const t = e.target.closest('[data-tick]'), g = e.target.closest('[data-send]');
  if (t) {
    const n = t.dataset.tick;
    if (chosen.has(n)) chosen.delete(n);
    else if ([...chosen].length >= ROOM_MAX[view]) { $('devs-note').classList.remove('nudge'); void $('devs-note').offsetWidth; $('devs-note').classList.add('nudge'); return; }
    else chosen.add(n);
    renderList(); paint(); draw();
    document.querySelector(`[data-tick="${n}"]`)?.focus();
  } else if (g && !g.disabled) { closeDevices(); startSend(g.dataset.send); }
});
stage.addEventListener('click', (e) => { const g = e.target.closest('.dev'); if (!g) return; const d = DEVICES.find((q) => q.name === g.dataset.dev); if (d?.on) startSend(d.name); });
const hd = $('devs-head'); let shDrag = null;
hd.addEventListener('pointerdown', (e) => { cancelAnimationFrame(SH.raf); SH.on = false; shDrag = { y0: e.clientY, from: SH.y, last: e.clientY, t: performance.now(), v: 0 }; hd.setPointerCapture(e.pointerId); });
hd.addEventListener('pointermove', (e) => { if (!shDrag) return; const raw = shDrag.from + e.clientY - shDrag.y0; SH.y = raw < 0 ? -rubber(-raw, 50) : raw; const now = performance.now(); shDrag.v = 0.7 * ((e.clientY - shDrag.last) / Math.max(1, now - shDrag.t)) * 1000 + 0.3 * shDrag.v; shDrag.last = e.clientY; shDrag.t = now; shDraw(); });
const hdUp = () => { if (!shDrag) return; const v = performance.now() - shDrag.t > 90 ? 0 : shDrag.v; shDrag = null; shGo(SH.y + v * 0.18 > SH.H * 0.4 ? SH.H : 0, v); };
hd.addEventListener('pointerup', hdUp); hd.addEventListener('pointercancel', hdUp);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !devs.hidden) closeDevices(); });

const h = location.hash.slice(1).split('-');
if (h[0] === 'girl') who = 'girl';
if (h[1] === '8') count = 8;
if (h[1] === '12') count = 12;
if (h[2] === 'phone') view = 'phone';
if (h[3] === 'send') { sending = true; pct = 46; }
pickDefaults();
paint();
measure();
if (h.includes('closed')) { goal = H; py = H; draw(); }
