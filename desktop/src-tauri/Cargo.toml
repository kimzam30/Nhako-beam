[package]
name = "nhako-desktop"
description = "Nhako Beam desktop app: the Svelte UI in a Tauri window, running the real engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "nhako-beam"

[[bin]]
name = "nhako-beam"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
nhako-core = { path = "../../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tokio = { version = "1.53.2", features = ["sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Windows: the Explorer "Send with Nhako Beam" menu entry (src/filemenu.rs).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
