[workspace]
resolver = "3"
members = ["core", "cli", "ffi", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kimzam30/Nhako-beam"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Optimise dependencies in dev and test builds, so hashing and crypto run at real speed.
[profile.dev.package."*"]
opt-level = 2
