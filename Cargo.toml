[workspace]
resolver = "3"
members = ["core", "cli", "ffi", "desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kimzam30/Nhako-beam"

# Phase 8: full LTO and one codegen unit made the Android engine 13% smaller (16.8 to 14.5 MB for
# arm64) and transfers a little faster (345 to 365 MB/s on localhost). opt-level "s" was smaller
# still but 10% slower, so it stays at 3. Panics must unwind: UniFFI turns them into errors.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Optimise dependencies in dev and test builds, so hashing and crypto run at real speed.
[profile.dev.package."*"]
opt-level = 2
