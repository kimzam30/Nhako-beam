[package]
name = "nhako-core"
description = "Nhako Beam transfer engine: pairing, discovery and the nhako/1 file transfer protocol on iroh."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6.0"
blake3 = "1.8.7"
# Checksums in the zip of everything, for Share via link (share.rs).
crc32fast = "1.5"
data-encoding = "2.11.1"
directories = "6.0.0"
fs4 = "1.1.0"
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
iroh-relay = { version = "1.3", default-features = false, features = ["tls-ring"] }
mime_guess = "2.0.5"
n0-future = "0.3.2"
# The beacon: every network adapter, and its own socket options (beacon.rs).
netdev = "0.46"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "io-util"] }
tracing = "0.1.44"
url = "2.5"

# Windows: battery check for the default device kind (laptop or desktop).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

# Unix: open part files without following links (O_NOFOLLOW).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A real relay and lookup server inside the tests, so the own-server path is covered without Docker.
iroh-dns-server = "1.3"
iroh-relay = { version = "1.3", features = ["server"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Reads back the zip that Share via link makes, in its tests.
zip = { version = "4", default-features = false }
