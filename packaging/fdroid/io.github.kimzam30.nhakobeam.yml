# Draft build recipe for F-Droid (docs/releasing.md, "F-Droid"). It goes in F-Droid's own
# repository, gitlab.com/fdroid/fdroiddata, as metadata/io.github.kimzam30.nhakobeam.yml, through a
# merge request you open there. Their reviewers usually ask for small changes; this is the start.
#
# The app's text and screenshots come from fastlane/metadata/android/ in this repository.
Categories:
  - Connectivity
  - System
License: MIT OR Apache-2.0
AuthorName: kimzam30
SourceCode: https://github.com/kimzam30/Nhako-beam
IssueTracker: https://github.com/kimzam30/Nhako-beam/issues
Changelog: https://github.com/kimzam30/Nhako-beam/releases

AutoName: Nhako Beam

RepoType: git
Repo: https://github.com/kimzam30/Nhako-beam.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y build-essential
    srclibs:
      - rustup@1.27.1
    output: build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    prebuild:
      - $$rustup$$/rustup-init.sh -y --profile minimal --default-toolchain stable
      - source $HOME/.cargo/env
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk --locked
    build:
      - source $HOME/.cargo/env
    gradle:
      - yes
    # nhako.fdroid: no Firebase and no update check (android/app/build.gradle.kts).
    # nhako.abis: one phone type per build (almost every phone is arm64).
    gradleprops:
      - nhako.fdroid
      - nhako.abis=arm64-v8a
    ndk: 29.0.14206865

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.2.0
CurrentVersionCode: 2
